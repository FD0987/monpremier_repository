<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon premier site</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2933;
            --muted: #5f6b7a;
            --accent: #4f46e5;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1420;
                --card: #1a2131;
                --text: #e6e9ef;
                --muted: #9aa5b5;
                --accent: #8b85ff;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 560px;
            width: 100%;
            background: var(--card);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .emoji { font-size: 3rem; }
        h1 { margin: 8px 0; font-size: 1.8rem; }
        p { color: var(--muted); }
        button {
            margin-top: 16px;
            padding: 12px 24px;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:active { transform: scale(0.97); }
        #compteur { margin-top: 12px; font-weight: 600; color: var(--text); }
        footer { margin-top: 24px; font-size: 0.85rem; color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <div class="emoji">🚀</div>
        <h1>Bonjour le monde !</h1>
        <p>Ceci est mon premier site de test, publié avec GitHub Pages.</p>
        <button id="bouton">Clique-moi</button>
        <div id="compteur">Pas encore de clic.</div>
        <footer>Fait avec ❤️ sur GitHub</footer>
    </main>
    <script>
        let clics = 0;
        document.getElementById("bouton").addEventListener("click", function () {
            clics++;
            document.getElementById("compteur").textContent =
                clics === 1 ? "1 clic 🎉" : clics + " clics 🎉";
        });
    </script>
</body>
</html>
